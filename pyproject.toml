[project]
name = "fx-treasury-risk"
version = "0.1.0"
description = "FX treasury risk system for a stylized multi-entity, multi-currency payments business: exposure, VaR/ES, stress, forecasting and forward-hedge optimization."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [{ name = "Vikram Rai" }]
dependencies = [
    "duckdb>=1.1",
    "numpy>=2.0",
    "pandas>=2.2",
    "pyyaml>=6.0",
    "requests>=2.32",
    "typer>=0.12",
    "rich>=13.0",
    "scipy>=1.14",
    "matplotlib>=3.9",
]

[project.scripts]
fxrisk = "fx_treasury_risk.cli:app"

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pandas-stubs>=2.2",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "types-PyYAML>=6.0",
    "types-requests>=2.32",
]

[tool.uv]
# Copy packages into the environment instead of hard-linking them from uv's cache. Hard
# links fail on Windows when the cache or the project sits in a cloud-synced folder
# (OneDrive: "incompatible hardlinks", os error 396). Costs a few seconds and some disk.
link-mode = "copy"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fx_treasury_risk"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "W", "D", "SIM", "RUF"]
ignore = [
    "D100", "D104",  # module / package docstrings are optional
    "D203", "D213",  # conflicting docstring styles; we use D211/D212
    "D401",          # imperative mood reads badly on property-style docstrings
    "RUF012",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]
"dags/*" = ["D"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.mypy]
python_version = "3.12"
packages = ["fx_treasury_risk"]
strict = true
warn_unreachable = true
# duckdb ships its own stubs; pandas via pandas-stubs; yaml/requests via types-*.
[[tool.mypy.overrides]]
module = ["duckdb.*", "scipy.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "network: tests that need internet access (skipped in CI)",
]
filterwarnings = ["error::DeprecationWarning:fx_treasury_risk.*"]
