name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  # CI never touches the network: everything runs from the committed cache, no API key.
  FXRISK_OFFLINE: "1"
  UV_LINK_MODE: copy

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install (locked)
        run: uv sync --all-groups --locked

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Type check
        run: uv run mypy

      - name: Tests
        run: uv run pytest -q

      - name: Data quality from committed cache
        # Rebuilds DuckDB from data/cache and runs every check. A FAIL (exit 1) fails the
        # job; the committed cache is expected to pass (staleness is judged against the
        # retrieval date, not today's date).
        run: uv run fxrisk quality

      - name: Flows, exposure, forecast, backtests, hedge, risk and the decision report
        run: |
          uv run fxrisk flows
          uv run fxrisk exposure
          uv run fxrisk forecast
          uv run fxrisk backtest
          uv run fxrisk hedge
          uv run fxrisk risk --mc-paths 5000
          uv run fxrisk report

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            reports/decision_report.md
            reports/quality_report.md
            reports/alerts.md
            reports/risk_tables.md
            reports/var_backtest.md
            reports/forecast_eval.md
            reports/hedge_recommendation.md
            reports/policy_backtest.md
            reports/figures/*.png
