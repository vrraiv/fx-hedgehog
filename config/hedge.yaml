# Hedge policy configuration. Round numbers, all stylized.

# Risk budget: the 21-day 99% Expected Shortfall of the hedged book may not exceed this.
# Fixed in USD because that is how a treasury risk appetite is written; as the synthetic
# business grows (8% a year) the budget binds progressively harder.
es_budget_usd: 4000000
horizon_days: 21
confidence: 0.99

# Risk model used inside the optimizer and for the ex-ante ES check: Student-t with
# EWMA(0.94) covariance, the model selected on 2012-2014 by the FZ0 score (ADR-0010). It
# gets the 99% exception count and ES size right from 2015 but its exceptions cluster;
# the decision report states the verdicts and flags it if the selection changes.
risk_model:
  method: parametric_t
  lam: 0.94
  window: 1000

# Instruments: one-month outright forwards, rolled at each monthly rebalance.
forward_tenor_days: 30

# One-way bid-ask spread paid on the full notional of every new forward, in basis points
# of notional. Stylized order-of-magnitude figures for a corporate dealing with a bank.
bid_ask_bp:
  EUR: 0.5
  GBP: 0.7
  CAD: 0.7
  JPY: 0.6
  AUD: 0.9
  CHF: 0.8
  MXN: 3.0
  BRL: 8.0
  INR: 6.0
  SGD: 1.5

# Hedge notionals below this USD amount are rounded to zero (minimum ticket).
min_ticket_usd: 250000

# Turnover penalty, basis points of the notional *changed* since last month, added to the
# optimizer's objective only. It is a stated preference for a stable programme, not a
# modelled cost: forwards are re-dealt in full every month, so the spread already prices
# the trading. With a hard ES constraint and linear costs the optimum is bang-bang, and
# when the budget binds it moves between MXN and AUD on small changes in volatility.
# Measured over the 2015-2026 backtest (ADR-0012): 2 bp gives 35 monthly ratio jumps
# above 0.5, 10 bp gives 24, 20 bp gives 19, with total P&L, volatility and hedging cost
# unchanged to within USD 0.5m, 0.03m and 0.02m a year. 10 bp is the middle of that range.
turnover_penalty_bp: 10.0

# Walk-forward policy backtest.
oos_start: 2015-01-01
rebalance: monthly          # first NY business day of each month
exposure_input: forecast    # 'forecast' = median forecast averaged over the holding month; 'actual' = exposure on the rebalance date
policies: [unhedged, legacy_50, full_hedge, optimizer]
